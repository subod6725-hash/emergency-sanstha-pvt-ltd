<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Sanstha Pvt Ltd | Admin Panel</title>
<link rel="stylesheet" href="styles.css">
</head>

<body class="admin-body">

<header class="top">
  <div class="brand">
    <div class="logo">ES</div>
    <div>
      <b>EMERGENCY SANSTHA PVT LTD</b>
      <small>Admin Panel</small>
    </div>
  </div>

  <nav>
    <a href="index.html">Public Website</a>
    <button class="outline" onclick="adminLogout()">Logout</button>
  </nav>
</header>

<main class="admin-wrap">

<aside class="sidebar">
  <button class="side active" onclick="showTab('dashboard',this)">📊 Dashboard</button>
  <button class="side" onclick="showTab('customers',this)">👤 Customers</button>
  <button class="side" onclick="showTab('loans',this)">💳 Loans</button>
  <button class="side" onclick="showTab('investors',this)">💰 Investors</button>
  <button class="side" onclick="showTab('requests',this)">🎧 Service Requests</button>
  <button class="side" onclick="showTab('documents',this)">📁 Documents</button>
  <button class="side" onclick="showTab('settings',this)">⚙️ Settings</button>
</aside>

<section class="admin-content">

<div id="dashboard" class="tab">
  <div class="page-title">
    <div>
      <span class="eyebrow">ADMIN DASHBOARD</span>
      <h1>सिस्टम Overview</h1>
    </div>
    <span class="status">● System Online</span>
  </div>

  <div class="admin-stats">
    <div><small>Total Customers</small><b id="statCustomers">0</b></div>
    <div><small>Active Loans</small><b id="statLoans">0</b></div>
    <div><small>Investors</small><b id="statInvestors">0</b></div>
    <div><small>Pending Requests</small><b id="statRequests">0</b></div>
  </div>

  <div class="panel">
    <h2>Quick Actions</h2>
    <div class="quick">
      <button onclick="showTab('customers')">+ Add Customer</button>
      <button onclick="showTab('loans')">+ Add Loan</button>
      <button onclick="showTab('investors')">+ Add Investor</button>
      <button onclick="showTab('requests')">+ New Request</button>
    </div>
  </div>
</div>

<!-- बाकी tabs same रहेंगे -->
</section>
</main>

<script src="admin.js"></script>

<!-- 🔥 REAL LOGOUT SCRIPT -->
<script>
function adminLogout() {
  fetch('/logout', {
    method: 'POST'
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("Logout Successful");
      window.location.href = "index.html";
    }
  })
  .catch(() => {
    alert("Logout error");
  });
}
</script>

</body>
</html>
<script>
// 🔐 CHECK LOGIN BEFORE OPEN
fetch('/check-auth')
  .then(res => res.json())
  .then(data => {
    if (!data.loggedIn) {
      alert("Please login first");
      window.location.href = "index.html";
    }
  });
</script>
